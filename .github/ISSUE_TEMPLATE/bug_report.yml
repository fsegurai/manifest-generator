name: Bug Report
description: File a bug report for @fsegurai/manifest-generator.
title: "[Bug]"
labels: bug
body:
  - type: textarea
    id: issue
    attributes:
      label: Description of the issue
      description: What's the issue you encountered?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: How can the issue be reproduced?
      placeholder: Describe each step as precisely as possible
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log file / error output
      description: A log file or error output will help diagnose the issue.
      placeholder: Paste the log file or error output here
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of the software are you using?
      placeholder: 1.0.0-beta.2
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime (Bun / Node)
      description: Which runtime and version are you using?
      placeholder: "Bun 1.3.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "e.g. Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context?
      description: |
        - Additional info about your environment:
        - Any other information relevant to your issue.
    validations:
      required: false
