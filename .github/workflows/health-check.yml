# Health check: build, tests with coverage, lint and `bun audit` on main, weekly, on pushes to main that touch the
# package sources or the root manifest, and on demand. The report goes to the job summary and an artifact, and is
# added as a comment to the open issue labelled `health-check`, if there is one.
# This repository is the public GitHub mirror of the Azure DevOps repository: the ADO build pipeline
# (`pipelines/.ado/build-pipeline.yml`, MIRROR stage) pushes `main` here, so a push to main is a mirror push and a
# merge on GitHub is overwritten by the next one.
name: Health check

on:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'packages/*/src/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health-check:
    name: Project health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # comments the report on the open `health-check` issue
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.3' }}
      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Build packages
        id: build
        run: bun run build:packages 2>&1 | tee build.log

      - name: Test with coverage
        id: test
        if: ${{ !cancelled() }}
        run: bun run test:packages 2>&1 | tee test.log

      - name: Lint
        id: lint
        if: ${{ !cancelled() }}
        run: bun run lint 2>&1 | tee lint.log

      # Advisories are reported, not a failure.
      - name: Dependency audit
        id: audit
        if: ${{ !cancelled() }}
        run: |
          if bun audit --production > audit.log 2>&1; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=advisories" >> "$GITHUB_OUTPUT"
          fi

      - name: Health report
        if: ${{ !cancelled() }}
        env:
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
          LINT: ${{ steps.lint.outcome }}
          AUDIT: ${{ steps.audit.outputs.status }}
        run: |
          {
            echo "## Project health report"
            echo ""
            echo "Generated: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| Build | ${BUILD} |"
            echo "| Tests | ${TEST} |"
            echo "| Lint | ${LINT} |"
            echo "| Audit | ${AUDIT:-not run} |"
            for log in build test lint audit; do
              if [ -f "${log}.log" ]; then
                echo ""
                echo "### ${log} log (last 20 lines)"
                echo '```'
                tail -20 "${log}.log"
                echo '```'
              fi
            done
          } > health-report.md
          cat health-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload health report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: health-report
          path: |
            health-report.md
            *.log
          retention-days: 90

      - name: Comment on the health-check issue
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            if (!fs.existsSync('health-report.md')) {
              core.info('Health report not found, skipping the issue comment');
              return;
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'health-check',
              state: 'open',
            });
            if (issues.length === 0) {
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issues[0].number,
              body: `## Updated health check\n\n${fs.readFileSync('health-report.md', 'utf8')}`,
            });
