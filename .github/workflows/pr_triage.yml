name: "Pull Request Triage"

on:
  pull_request_target:
    types: [ opened, ready_for_review, reopened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          repository: fsegurai/manifest-generator
          ref: main

      - name: Update labels based on changes
        uses: actions/labeler@v5
        with:
          sync-labels: true
          dot: true

      - name: Assign PR creator and add welcome comment
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const assignees = pr.assignees.map(assignee => assignee.login);
            let assignee = pr.user.login;

            if (!assignees.includes(assignee)) {
              if (assignee.includes('bot')) {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  reviewers: ['fsegurai']
                });
              } else {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  assignees: [assignee]
                });
              }
            }

      - name: Add first-time contributor welcome
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            const userPRs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: author,
              state: 'all'
            });

            if (userPRs.data.length === 1) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: '👋 **Welcome, @' + author + '!**\n\nThank you for your contribution to manifest-generator! Here\'s what to expect:\n\n- **Tests run automatically** - our CI pipeline validates linting, types, and tests\n- **Reviews** - a maintainer will review your changes\n- **Labels** - we auto-tag PRs to help organize discussions\n- **Questions?** - feel free to ask in the comments\n\n📚 **Helpful Resources:**\n- [Contributing Guide](./CONTRIBUTING.md)\n- [AGENTS Guide](./AGENTS.md) - Project architecture\n- [Development Setup](./README.md#development)\n\nWe appreciate your help! 🎉'
              });
            }

      - name: Add Dependabot PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            if (!author.includes('dependabot')) {
              return;
            }

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });

            const hasDepbotComment = comments.data.some(c =>
              c.body.includes('Dependabot Update') || c.body.includes('@dependabot')
            );

            if (!hasDepbotComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: '🤖 **Dependabot Update**\n\nThis is an automated dependency update. A few things to know:\n\n- **Bun workspace**: All dependencies are managed through the root `package.json`\n- **Build checks**: The PR build validates the package compiles\n- **Security**: Our security scan pipeline reviews all updates\n- **Merge**: Maintainers will review and merge periodically\n\n💡 Tip: Use `@dependabot rebase` to update this PR if conflicts occur.'
              });
            }

      - name: Detect affected package areas
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            const affectedAreas = new Set();
            files.data.forEach(f => {
              if (f.filename.startsWith('packages/manifest-generator/src/')) {
                affectedAreas.add('manifest-generator');
              } else if (f.filename.startsWith('packages/.helper/')) {
                affectedAreas.add('build-helper');
              } else if (f.filename.startsWith('demo/')) {
                affectedAreas.add('demo');
              } else if (f.filename.startsWith('.github/')) {
                affectedAreas.add('ci-cd');
              } else if (f.filename === 'package.json' || f.filename === 'bun.lock') {
                affectedAreas.add('dependencies');
              }
            });

            if (affectedAreas.size > 0) {
              const areas = Array.from(affectedAreas).join(', ');
              const body = `📦 **Affected areas:** ${areas}`;

              if (!pr.body.includes(body)) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  body: pr.body ? pr.body + '\n\n' + body : body
                });
              }
            }
