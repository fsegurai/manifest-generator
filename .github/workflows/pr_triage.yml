# Pull request triage: labels the pull request from `.github/labeler.yml`, assigns its author (or requests a review
# from the maintainer for bots), welcomes first-time contributors, explains Dependabot notices and lists the affected
# areas in the description. Runs when a pull request is opened, reopened or marked ready for review.
# `pull_request_target` gives the token write access on pull requests from forks; it is safe here because nothing
# from the pull request is checked out or executed: the labeler reads its configuration from the base branch through
# the API, and the scripts only read the event payload and call the REST API.
# This repository is the public GitHub mirror of the Azure DevOps repository: the ADO build pipeline
# (`pipelines/.ado/build-pipeline.yml`, MIRROR stage) pushes `main` here, so a merge on GitHub is overwritten by the
# next push; accepted changes are applied in ADO.
name: Pull request triage

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout or execution of pull request code (see above)
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Triage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # labels and assignees go through the issues API
      pull-requests: write # labels, review requests, comments and the description
    steps:
      - name: Label from changed files
        uses: actions/labeler@v7
        with:
          sync-labels: true

      - name: Assign the author
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            if (pr.assignees.some((assignee) => assignee.login === author)) {
              return;
            }
            if (pr.user.type === 'Bot') {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                reviewers: ['fsegurai'],
              });
            } else {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [author],
              });
            }

      - name: Welcome first-time contributors
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.user.type === 'Bot' || context.payload.action !== 'opened') {
              return;
            }
            const author = pr.user.login;
            const { data: results } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:pr author:${author}`,
              per_page: 2,
            });
            if (results.total_count > 1) {
              return;
            }
            const blob = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                `Welcome, @${author}, and thank you for contributing to manifest-generator.`,
                '',
                '- **Checks** run automatically: lint, format, type check, tests and build.',
                '- **Review**: a maintainer reviews the change. This repository is a mirror of the Azure DevOps repository, so an accepted change is applied there and arrives here with the next mirror push.',
                '- **Labels** are added from the changed files.',
                '',
                `Helpful resources: [Contributing guide](${blob}/CONTRIBUTING.md), [AGENTS guide](${blob}/AGENTS.md), [Local development](${blob}/README.md#local-development).`,
              ].join('\n'),
            });

      - name: Explain Dependabot notices
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.user.login !== 'dependabot[bot]') {
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            if (comments.some((comment) => comment.body?.includes('Dependabot notice'))) {
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                '**Dependabot notice**',
                '',
                'This repository is a mirror of the Azure DevOps repository: a merge here is overwritten by the next mirror push.',
                'Apply the update in the Azure DevOps repository (root `package.json` and `bun.lock` for the Bun workspace) and let the mirror carry it; this pull request then closes as superseded.',
              ].join('\n'),
            });

      - name: List affected areas
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            const areas = new Set();
            for (const { filename } of files) {
              if (filename.startsWith('packages/manifest-generator/')) {
                areas.add('manifest-generator');
              } else if (filename.startsWith('packages/.helper/')) {
                areas.add('build-helper');
              } else if (filename.startsWith('demo/')) {
                areas.add('demo');
              } else if (filename.startsWith('docs/')) {
                areas.add('docs');
              } else if (filename.startsWith('.github/') || filename.startsWith('pipelines/')) {
                areas.add('ci-cd');
              } else if (filename === 'package.json' || filename === 'bun.lock') {
                areas.add('dependencies');
              }
            }
            if (areas.size === 0) {
              return;
            }
            const line = `**Affected areas:** ${[...areas].join(', ')}`;
            const body = pr.body ?? '';
            if (body.includes('**Affected areas:**')) {
              return;
            }
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: body ? `${body}\n\n${line}` : line,
            });
