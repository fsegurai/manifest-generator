# Performance monitor: builds the package (`bun run build:packages`) on the base branch and on the pull request
# and compares the size of `packages/manifest-generator/dist`; the job fails when it grows by more than 10%. Runs on
# pull requests to main that touch the package or its build configuration, and on demand (against main).
# This repository is the public GitHub mirror of the Azure DevOps repository: the ADO build pipeline
# (`pipelines/.ado/build-pipeline.yml`, MIRROR stage) pushes `main` here, so a merge on GitHub is overwritten by the
# next push. ADO has no bundle size check; this one is GitHub only.
name: Performance monitor

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/*/src/**'
      - 'packages/*/vite*.config.ts'
      - 'packages/*/package.json'
      - 'vite.config.ts'
      - 'bun.lock'
      - '.github/workflows/perf-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-size-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bundle-size:
    name: Compare bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref || 'main' }}
          path: base
          persist-credentials: false

      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          path: pr
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.3' }}

      - name: Build base branch
        working-directory: base
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build:packages

      - name: Build pull request
        working-directory: pr
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build:packages

      - name: Compare sizes
        id: sizes
        run: |
          dist=packages/manifest-generator/dist
          base_size=$(du -sb "base/$dist" | awk '{print $1}')
          pr_size=$(du -sb "pr/$dist" | awk '{print $1}')
          diff=$((pr_size - base_size))
          percent=$(( (diff * 100) / base_size ))
          echo "percent=$percent" >> "$GITHUB_OUTPUT"
          {
            echo "## Bundle size (${dist})"
            echo ""
            echo "| Metric | Bytes |"
            echo "|--------|-------|"
            echo "| Base | ${base_size} |"
            echo "| Pull request | ${pr_size} |"
            echo "| Change | ${diff} (${percent}%) |"
            echo ""
            echo '```'
            echo "Base:"
            (cd "base/$dist" && du -ab . | sort -k2)
            echo ""
            echo "Pull request:"
            (cd "pr/$dist" && du -ab . | sort -k2)
            echo '```'
          } | tee sizes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bundle-size-report
          path: sizes.md
          retention-days: 30

      - name: Fail on a size regression above 10%
        if: ${{ fromJSON(steps.sizes.outputs.percent) > 10 }}
        env:
          PERCENT: ${{ steps.sizes.outputs.percent }}
        run: |
          echo "::error::The bundle grew by ${PERCENT}% (limit 10%)"
          exit 1
