# Checks: Biome (lint + format), the package type check and the full build (packages and demo), on pull requests
# to main and on demand.
# This repository is the public GitHub mirror of the Azure DevOps repository: the ADO build pipeline
# (`pipelines/.ado/build-pipeline.yml`, MIRROR stage) pushes `main` here, so a merge on GitHub is overwritten by the
# next push. ADO's PR pipeline (`pipelines/.ado/pr-pipeline.yml`) runs the same `build`, `lint` and `format:audit`
# scripts plus the tests; this workflow gives the same signal on GitHub pull requests (mostly Dependabot notices).
name: Checks

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.3' }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run format:audit

  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.3' }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test-types:packages

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.3' }}
      - run: bun install --frozen-lockfile --ignore-scripts
      # Same root script as the ADO PR pipeline: packages, their README/LICENSE, the demo and its metadata.
      - run: bun run build
