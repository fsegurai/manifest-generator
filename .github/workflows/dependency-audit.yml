# Dependency audit: `bun audit` (production dependencies) and `bun outdated`, weekly, on pull requests that change
# the manifests or the lockfile, and on demand. Advisories are reported in the job summary and an artifact, never a
# failure; the weekly run opens one `security` issue while advisories remain.
# This repository is the public GitHub mirror of the Azure DevOps repository: the ADO build pipeline
# (`pipelines/.ado/build-pipeline.yml`, MIRROR stage) pushes `main` here, so a merge on GitHub is overwritten by the
# next push. Dependency updates are applied in ADO (see `.github/dependabot.yml`).
name: Dependency audit

on:
  schedule:
    - cron: '0 4 * * 3'
  pull_request:
    paths:
      - 'package.json'
      - 'packages/*/package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # the scheduled run opens a `security` issue when advisories are found
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.3' }}
      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit and outdated report
        id: audit
        run: |
          set +e
          bun audit --production > audit-security.txt 2>&1
          audit_status=$?
          bun outdated > outdated-report.txt 2>&1
          set -e
          if [ "$audit_status" -ne 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## Dependency audit"
            echo ""
            if [ "$audit_status" -ne 0 ]; then
              echo "### Advisories found"
            else
              echo "### No advisories"
            fi
            echo '```'
            cat audit-security.txt
            echo '```'
            echo ""
            echo "### Outdated packages"
            echo '```'
            cat outdated-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-reports
          path: |
            audit-security.txt
            outdated-report.txt
          retention-days: 30

      - name: Open an issue for advisories
        if: steps.audit.outputs.found == 'true' && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const audit = fs.readFileSync('audit-security.txt', 'utf8');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security',
              state: 'open',
            });
            if (issues.some((issue) => issue.title.includes('Dependency vulnerabilities'))) {
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Dependency vulnerabilities detected',
              body: `## Security audit\n\nThe scheduled \`bun audit --production\` reported advisories. Apply the fix in the Azure DevOps repository.\n\n\`\`\`\n${audit}\n\`\`\``,
              labels: ['security', 'dependencies'],
            });
