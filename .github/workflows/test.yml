# Tests: the package test suite with coverage (`bun run test:packages`), on pull requests and pushes to main that
# touch the package, the demo or the test setup, and on demand. Lint, type check and build run in `checks.yml`.
# This repository is the public GitHub mirror of the Azure DevOps repository: the ADO build pipeline
# (`pipelines/.ado/build-pipeline.yml`, MIRROR stage) pushes `main` here, so a merge on GitHub is overwritten by the
# next push. ADO's PR pipeline (`pipelines/.ado/pr-pipeline.yml`) runs the same `test:packages` script.
name: Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'demo/scripts/**'
      - 'bunfig.toml'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'demo/scripts/**'
      - 'bunfig.toml'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.3' }}
      - run: bun install --frozen-lockfile --ignore-scripts
      # Coverage thresholds come from bunfig.toml ([test] coverageThreshold).
      - run: bun run test:packages
