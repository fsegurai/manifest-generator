name: Documentation

on:
  push:
    branches: [ 'main' ]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'demo/**'
      - 'docs/**'
  pull_request:
    branches: [ 'main' ]
    paths:
      - '**/*.md'
      - 'demo/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  validate-markdown:
    name: Validate Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check markdown syntax
        run: |
          find . -name '*.md' -type f -not -path '*/node_modules/*' -not -path '*/.*' -not -path '*/dist/*' | while read -r file; do
            echo "Checking $file..."
            total_backticks=$(grep -c '^```' "$file" 2>/dev/null || true)
            if [ $((total_backticks % 2)) -ne 0 ]; then
              echo "❌ Unclosed code block in $file"
              exit 1
            fi
          done
          echo "✅ All markdown syntax valid"

      - name: Check for broken internal links in markdown
        run: |
          BROKEN=0
          find . -name '*.md' -type f -not -path '*/node_modules/*' -not -path '*/.*' -not -path '*/dist/*' | while read -r file; do
            grep -oE '\[([^\]]+)\]\(([^)]+)\)' "$file" 2>/dev/null | sed 's/.*(\([^)]*\)).*/\1/' | while read -r link; do
              [ -z "$link" ] && continue
              [[ $link == http* ]] && continue
              [[ $link == \#* ]] && continue
              if ! [ -f "$link" ] && ! [ -d "$link" ]; then
                echo "❌ Broken link in $file: $link"
                BROKEN=1
              fi
            done
          done
          [ $BROKEN -eq 0 ] && echo "✅ All links valid" || exit 1

      - name: Comment on PR if issues found
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Documentation Issues Found**\n\nPlease fix markdown syntax and broken links. Check the workflow logs for details.'
            })

  validate-readme:
    name: Validate README Structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate README has required sections
        run: |
          echo "Validating README.md structure..."
          REQUIRED_SECTIONS=("What the package does" "Repository structure" "Run locally" "Use as an external user")
          MISSING=0
          for section in "${REQUIRED_SECTIONS[@]}"; do
            if ! grep -q "^## $section\|^### $section" README.md; then
              echo "⚠️ Missing or incorrectly formatted section: $section"
              MISSING=1
            fi
          done
          [ $MISSING -eq 0 ] && echo "✅ README structure valid"

      - name: Validate docs structure
        run: |
          echo "Validating docs directory..."
          if [ -d "docs" ]; then
            echo "✅ docs/ directory exists"
            echo "Version subdirectories:"
            ls -d docs/*/ 2>/dev/null || echo "  (none)"
          else
            echo "⚠️ No docs/ directory found"
          fi

  build-demo:
    name: Validate Demo Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Validate demo structure
        run: |
          echo "Validating demo application..."
          REQUIRED_FILES=(
            "demo/index.html"
            "demo/vite.config.ts"
            "demo/scripts/index.ts"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ Missing critical file: $file"
              exit 1
            fi
          done

      - name: Build demo
        run: |
          echo "Building demo application..."
          bun run build:demo 2>&1 | head -50
          echo "✅ Demo built successfully"

      - name: Comment on PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📚 **Documentation Check Passed**\n\n✅ All markdown validated\n✅ Links verified\n✅ Demo builds successfully'
            })

  generate-summary:
    name: Documentation Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [ validate-markdown, validate-readme, build-demo ]
    steps:
      - name: Create documentation summary
        run: |
          echo "## 📚 Documentation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Markdown Syntax | ${{ needs.validate-markdown.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| README Structure | ${{ needs.validate-readme.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Demo Build | ${{ needs.build-demo.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
