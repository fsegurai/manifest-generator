# Documentation: Markdown code fences (failing), relative links and README sections (reported as warnings), and the
# demo build (`bun run build:demo`), on pull requests and pushes to main that touch the docs or the demo, and on
# demand. Nothing is deployed from here.
# This repository is the public GitHub mirror of the Azure DevOps repository: the ADO build pipeline
# (`pipelines/.ado/build-pipeline.yml`, MIRROR stage) pushes `main` here, so a merge on GitHub is overwritten by the
# next push. The demo site is built and published by the ADO release pipeline (`pipelines/.ado/release-pipeline.yml`).
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'demo/**'
      - 'docs/**'
      - 'vite.config.ts'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'demo/**'
      - 'docs/**'
      - 'vite.config.ts'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Validate Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check code fences
        run: |
          status=0
          while IFS= read -r -d '' file; do
            fences=$(grep -cE '^[[:space:]]*```' "$file" || true)
            if [ $((fences % 2)) -ne 0 ]; then
              echo "::error file=${file#./}::Unclosed code block"
              status=1
            fi
          done < <(find . -name '*.md' -type f -not -path '*/node_modules/*' -not -path '*/.*' -not -path '*/dist/*' -print0)
          exit "$status"

      # Links are resolved relative to the Markdown file (or the repository root for `/…`); code blocks are skipped.
      - name: Check relative links
        run: |
          while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            while IFS= read -r link; do
              case "$link" in
                ''|http://*|https://*|mailto:*|\#*) continue ;;
              esac
              target=${link%%#*}
              target=${target%%\?*}
              target=${target%% *}
              [ -z "$target" ] && continue
              case "$target" in
                /*) path=".$target" ;;
                *) path="$dir/$target" ;;
              esac
              if [ ! -e "$path" ]; then
                echo "::warning file=${file#./}::Broken link: $link"
              fi
            done < <(awk '/^[[:space:]]*(```|~~~)/ { fence = !fence; next } !fence' "$file" | grep -oE '\]\([^)]+\)' | sed -E 's/^\]\((.*)\)$/\1/')
          done < <(find . -name '*.md' -type f -not -path '*/node_modules/*' -not -path '*/.*' -not -path '*/dist/*' -print0)

      - name: Check README sections
        run: |
          for section in 'What the package does' 'Installation' 'Usage' 'Local Development' 'License'; do
            if ! grep -qE "^##+ ${section}\$" README.md; then
              echo "::warning file=README.md::Missing section: ${section}"
            fi
          done

  demo:
    name: Build demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.3' }}
      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Check demo entry files
        run: |
          for file in vite.config.ts demo/index.html demo/scripts/index.ts; do
            if [ ! -f "$file" ]; then
              echo "::error file=${file}::Missing demo file"
              exit 1
            fi
          done

      - run: bun run build:demo
