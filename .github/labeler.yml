infra:
  - changed-files:
      - any-glob-to-any-file: [
        '!.github/workflows/**',
        '.github/**',
        '.editorconfig',
        '.env*',
        'bun.lock',
        'eslint*.js',
        'tsconfig*.json',
        'vite.config.*',
      ]

dependencies:
  - changed-files:
      - any-glob-to-any-file: [
        'bun.lock',
        'package.json',
        'packages/*/package.json',
      ]

ci-cd:
  - changed-files:
      - any-glob-to-any-file: [
        '.github/workflows/**',
      ]

library:
  - changed-files:
      - any-glob-to-any-file: [
        'packages/manifest-generator/**',
      ]

helper:
  - changed-files:
      - any-glob-to-any-file: [
        'packages/.helper/**',
      ]

demo:
  - changed-files:
      - any-glob-to-any-file: [
        'demo/**',
      ]

styles:
  - changed-files:
      - any-glob-to-any-file: [
        '**/*.scss',
        '**/*.css',
      ]

tests:
  - changed-files:
      - any-glob-to-any-file: [
        '**/spec/**',
        '**/*.test.*',
        '**/*.spec.*',
        'scripts/test-all-packages.ts',
      ]

documentation:
  - changed-files:
      - any-glob-to-any-file: [
        'docs/**',
        'AGENTS.md',
        'README.md',
        'LICENSE',
      ]
